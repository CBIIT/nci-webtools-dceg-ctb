name: Run Django Migrations
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to migrate"
        type: environment
        required: true

env:
  TZ: America/New_York
  CLOUD_SQL_PROXY_VERSION: v2.14.1

jobs:
  Migrate:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: "actions/checkout@v4"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: "Set up Google Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Generate .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Start Cloud SQL Auth Proxy
        env:
          INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCES }}
        run: |
          curl -sSfL -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          sudo mkdir -p /cloudsql && sudo chown "$(id -u):$(id -g)" /cloudsql
          ./cloud-sql-proxy --unix-socket /cloudsql "$INSTANCE" > proxy.log 2>&1 &
          for i in $(seq 1 30); do
            [ -S "/cloudsql/$INSTANCE" ] && exit 0
            sleep 1
          done
          cat proxy.log
          exit 1

      - name: Build image
        run: docker build -t ctb-migrate .

      - id: backup
        name: Back up database
        env:
          INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCES }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          DESCRIPTION="pre-migrate run ${{ github.run_id }} (${GITHUB_SHA::7})"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          gcloud sql backups create \
            --instance="${INSTANCE##*:}" \
            --project="$PROJECT_ID" \
            --description="$DESCRIPTION"
          BACKUP_ID=$(gcloud sql backups list \
            --instance="${INSTANCE##*:}" \
            --project="$PROJECT_ID" \
            --filter="description='$DESCRIPTION'" \
            --limit=1 \
            --format="value(id)")
          echo "id=$BACKUP_ID" >> "$GITHUB_OUTPUT"

      - id: migrate
        name: Run migrations
        run: |
          set -o pipefail
          docker run --rm \
            -v /cloudsql:/cloudsql \
            -v "$PWD/.env:/app/.env:ro" \
            ctb-migrate \
            sh -c "python3 manage.py migrate --noinput --settings=ctb.settings && python3 manage.py showmigrations --settings=ctb.settings" \
            2>&1 | tee migrate.log

      - name: Cloud SQL Auth Proxy logs
        if: always()
        run: cat proxy.log || true

      - name: Summary
        if: always()
        env:
          BACKUP_ID: ${{ steps.backup.outputs.id }}
          BACKUP_DESCRIPTION: ${{ steps.backup.outputs.description }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          {
            echo "## Django migrations"
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
            echo "| Cloud SQL Proxy | \`${CLOUD_SQL_PROXY_VERSION}\` |"
            echo "| Backup | ${BACKUP_OUTCOME:-not run} |"
            echo "| Backup ID | \`${BACKUP_ID:-n/a}\` |"
            echo "| Backup description | ${BACKUP_DESCRIPTION:-n/a} |"
            echo "| Migration result | ${MIGRATE_OUTCOME:-not run} |"
            echo "| Finished | $(date '+%Y-%m-%d %H:%M:%S %Z') |"
            if [ -f migrate.log ]; then
              echo
              echo "<details><summary>Migration output</summary>"
              echo
              echo '```'
              cat migrate.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
